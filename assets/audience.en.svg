<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 470" role="img" aria-label="Who is Cuadrilla for?">
<style>.h{font:800 30px "Segoe UI",Arial,sans-serif;fill:#EDF2F4}.i{font:24px "Segoe UI Emoji","Segoe UI",sans-serif}.c{font:700 21px "Segoe UI",Arial,sans-serif;fill:#EDF2F4}.m{font:400 15px "Segoe UI",Arial,sans-serif;fill:#A9B8C1}g g{animation:u .7s ease-out both}@keyframes u{from{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1140" height="470" rx="18" fill="#10151A"/><text x="32" y="56" class="h">Who is Cuadrilla for?</text><g><g transform="translate(30 86)"><rect width="348" height="168" rx="14" fill="#171F26" stroke="#2A3640"/><rect width="5" height="104" x="0" y="32" rx="2.5" fill="#F5A524"/><text x="26" y="48" class="i">💻</text><text x="26" y="88" class="c">Developers</text><text x="26" y="118" class="m">Audit, build and review web</text><text x="26" y="142" class="m">projects with more hands.</text></g><g transform="translate(396 86)"><rect width="348" height="168" rx="14" fill="#171F26" stroke="#2A3640"/><rect width="5" height="104" x="0" y="32" rx="2.5" fill="#2DD4BF"/><text x="26" y="48" class="i">🏢</text><text x="26" y="88" class="c">IT teams</text><text x="26" y="118" class="m">Share one way of working</text><text x="26" y="142" class="m">across the team.</text></g><g transform="translate(762 86)"><rect width="348" height="168" rx="14" fill="#171F26" stroke="#2A3640"/><rect width="5" height="104" x="0" y="32" rx="2.5" fill="#60A5FA"/><text x="26" y="48" class="i">🎨</text><text x="26" y="88" class="c">Designers</text><text x="26" y="118" class="m">Improve interfaces, motion</text><text x="26" y="142" class="m">and accessibility.</text></g><g transform="translate(30 272)"><rect width="348" height="168" rx="14" fill="#171F26" stroke="#2A3640"/><rect width="5" height="104" x="0" y="32" rx="2.5" fill="#2DD4BF"/><text x="26" y="48" class="i">📣</text><text x="26" y="88" class="c">Marketing</text><text x="26" y="118" class="m">Turn ideas into campaigns,</text><text x="26" y="142" class="m">SEO, copy and plans.</text></g><g transform="translate(396 272)"><rect width="348" height="168" rx="14" fill="#171F26" stroke="#2A3640"/><rect width="5" height="104" x="0" y="32" rx="2.5" fill="#60A5FA"/><text x="26" y="48" class="i">🚀</text><text x="26" y="88" class="c">Founders</text><text x="26" y="118" class="m">Go from idea to landing</text><text x="26" y="142" class="m">page and launch.</text></g><g transform="translate(762 272)"><rect width="348" height="168" rx="14" fill="#171F26" stroke="#2A3640"/><rect width="5" height="104" x="0" y="32" rx="2.5" fill="#F5A524"/><text x="26" y="48" class="i">🧰</text><text x="26" y="88" class="c">Freelancers</text><text x="26" y="118" class="m">Deliver more work with</text><text x="26" y="142" class="m">review and control.</text></g></g></svg>
